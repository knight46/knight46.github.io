<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Resource-aware GPU computation communication overlap</title>
  <desc id="desc">A framework diagram showing baseline overlap, resource-aware controls, and shorter exposed communication tail.</desc>
  <defs>
    <linearGradient id="computeGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="commGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="controlGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="980" height="560" rx="0" fill="#f8fafc"/>
  <rect x="42" y="36" width="896" height="488" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#softShadow)"/>

  <text x="72" y="82" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Resource-aware GPU Overlap</text>
  <text x="72" y="112" font-family="Arial, sans-serif" font-size="15" fill="#475569">Make communication progress explicit instead of letting compute kernels occupy all on-chip resources.</text>

  <text x="86" y="160" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Baseline overlap</text>
  <line x1="86" y1="192" x2="866" y2="192" stroke="#cbd5e1" stroke-width="2"/>
  <text x="86" y="187" font-family="Arial, sans-serif" font-size="12" fill="#64748b">time</text>
  <path d="M 840 192 L 866 192" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="152" y="214" width="496" height="48" rx="6" fill="url(#computeGrad)"/>
  <text x="174" y="244" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">compute kernel: high residency GEMM</text>
  <rect x="330" y="274" width="410" height="42" rx="6" fill="url(#commGrad)" opacity="0.88"/>
  <text x="352" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">collective kernel progresses slowly</text>
  <rect x="740" y="274" width="86" height="42" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <text x="757" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">tail</text>

  <text x="86" y="370" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Resource-aware overlap</text>
  <line x1="86" y1="402" x2="866" y2="402" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 840 402 L 866 402" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="152" y="424" width="430" height="48" rx="6" fill="url(#computeGrad)"/>
  <text x="174" y="454" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">compute kernel: shaped occupancy</text>
  <rect x="306" y="484" width="342" height="42" rx="6" fill="url(#commGrad)"/>
  <text x="328" y="510" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">high-priority communication stream</text>
  <rect x="648" y="484" width="34" height="42" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>

  <rect x="690" y="334" width="188" height="96" rx="8" fill="url(#controlGrad)" stroke="#94a3b8"/>
  <text x="712" y="363" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Runtime controls</text>
  <circle cx="718" cy="386" r="4" fill="#2563eb"/>
  <text x="732" y="391" font-family="Arial, sans-serif" font-size="13" fill="#334155">shared memory shaping</text>
  <circle cx="718" cy="412" r="4" fill="#dc2626"/>
  <text x="732" y="417" font-family="Arial, sans-serif" font-size="13" fill="#334155">stream priority</text>

  <path d="M 690 382 C 640 382, 612 412, 582 438" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M 690 408 C 654 438, 666 470, 648 493" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <rect x="86" y="214" width="46" height="48" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="98" y="244" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">SM</text>
  <rect x="86" y="424" width="46" height="48" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="98" y="454" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">SM</text>

  <text x="72" y="548" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Goal: minimize iteration critical path, not standalone GEMM or standalone collective time.</text>
</svg>
