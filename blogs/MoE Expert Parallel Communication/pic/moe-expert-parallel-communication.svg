<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">MoE expert-parallel communication framework</title>
  <desc id="desc">A framework diagram showing router, dispatch, expert GPU groups, combine, and overlap with attention or decode compute.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .panel-soft { fill: #ecfeff; stroke: #67e8f9; stroke-width: 2; rx: 8; }
      .panel-green { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; rx: 8; }
      .panel-amber { fill: #fffbeb; stroke: #fbbf24; stroke-width: 2; rx: 8; }
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #334155; }
      .tiny { font: 12px Arial, sans-serif; fill: #475569; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-green { fill: none; stroke: #059669; stroke-width: 3; marker-end: url(#arrow-green); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 7; }
      .token { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.5; rx: 5; }
      .expert { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; rx: 6; }
      .timeline { stroke: #94a3b8; stroke-width: 6; stroke-linecap: round; }
      .compute { stroke: #0f766e; stroke-width: 14; stroke-linecap: round; }
      .comm { stroke: #2563eb; stroke-width: 14; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="620"/>
  <text class="title" x="50" y="48">MoE 推理中的 Expert-Parallel 通信路径</text>
  <text class="small" x="50" y="76">核心目标：把 token dispatch / expert compute / combine 排成可重叠的流水线，减少 GPU 空等和 host 介入。</text>

  <rect class="panel" x="50" y="115" width="190" height="160"/>
  <text class="label" x="75" y="148">Token Batch</text>
  <rect class="token" x="78" y="172" width="36" height="28"/>
  <rect class="token" x="123" y="172" width="36" height="28"/>
  <rect class="token" x="168" y="172" width="36" height="28"/>
  <rect class="token" x="78" y="212" width="36" height="28"/>
  <rect class="token" x="123" y="212" width="36" height="28"/>
  <rect class="token" x="168" y="212" width="36" height="28"/>
  <text class="tiny" x="76" y="258">低延迟 decode 或高吞吐 prefill</text>

  <rect class="panel-amber" x="300" y="115" width="190" height="160"/>
  <text class="label" x="330" y="148">Router</text>
  <text class="small" x="326" y="182">top-k expert 选择</text>
  <text class="small" x="326" y="210">token 分桶与重排</text>
  <text class="small" x="326" y="238">负载不均衡感知</text>

  <rect class="panel-soft" x="550" y="92" width="230" height="210"/>
  <text class="label" x="588" y="126">Dispatch / Combine</text>
  <text class="small" x="584" y="158">GPU-initiated all-to-all</text>
  <text class="small" x="584" y="185">LL: 小 batch 低延迟</text>
  <text class="small" x="584" y="212">HT: 大 batch 分层聚合</text>
  <text class="small" x="584" y="239">FP8 / RDMA / NVLink</text>
  <text class="tiny" x="584" y="269">DeepEP / NCCL EP / M2N library</text>

  <rect class="panel-green" x="850" y="90" width="220" height="215"/>
  <text class="label" x="900" y="123">Expert GPUs</text>
  <rect class="expert" x="880" y="150" width="70" height="48"/>
  <rect class="expert" x="970" y="150" width="70" height="48"/>
  <rect class="expert" x="880" y="222" width="70" height="48"/>
  <rect class="expert" x="970" y="222" width="70" height="48"/>
  <text class="small" x="900" y="180">E0</text>
  <text class="small" x="990" y="180">E1</text>
  <text class="small" x="900" y="252">E2</text>
  <text class="small" x="990" y="252">E3</text>
  <text class="tiny" x="884" y="292">Grouped GEMM / expert FFN</text>

  <path class="arrow" d="M 240 195 C 260 195, 278 195, 300 195"/>
  <path class="arrow" d="M 490 195 C 515 195, 530 195, 550 195"/>
  <path class="arrow" d="M 780 170 C 805 150, 825 145, 850 150"/>
  <path class="arrow" d="M 780 223 C 805 248, 825 258, 850 260"/>
  <path class="arrow-green" d="M 850 305 C 760 350, 630 350, 550 302"/>
  <path class="arrow-green" d="M 550 302 C 470 345, 370 345, 300 275"/>

  <rect class="panel" x="70" y="365" width="980" height="185"/>
  <text class="label" x="100" y="400">时间线视角：不要只加速单个 all-to-all，而是压短 critical path</text>
  <line class="timeline" x1="120" y1="455" x2="1000" y2="455"/>
  <line class="compute" x1="145" y1="455" x2="360" y2="455"/>
  <line class="comm" x1="330" y1="455" x2="540" y2="455"/>
  <line class="compute" x1="500" y1="455" x2="735" y2="455"/>
  <line class="comm" x1="700" y1="455" x2="900" y2="455"/>
  <line class="compute" x1="858" y1="455" x2="980" y2="455"/>
  <text class="tiny" x="150" y="430">attention / gate</text>
  <text class="tiny" x="350" y="490">dispatch</text>
  <text class="tiny" x="545" y="430">expert compute</text>
  <text class="tiny" x="742" y="490">combine</text>
  <text class="tiny" x="875" y="430">next token</text>
  <path class="dash" d="M 330 425 L 330 510"/>
  <path class="dash" d="M 700 425 L 700 510"/>
  <text class="small" x="120" y="525">工程抓手：微批 ping-pong、LL/HT 双模式、分层 NVLink/RDMA、融合 AllReduce-RMSNorm、减少 SM 占用。</text>
</svg>
