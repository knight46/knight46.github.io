<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ARK KV cache routing framework</title>
  <desc id="desc">A framework diagram showing KV cache transfer path reservation and collision avoidance in disaggregated LLM serving.</desc>
  <defs>
    <linearGradient id="prefillGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="decodeGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="controlGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#16a34a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { stroke-width: 2; rx: 8; }
      .prefill { fill: url(#prefillGrad); stroke: #2563eb; }
      .decode { fill: url(#decodeGrad); stroke: #16a34a; }
      .control { fill: url(#controlGrad); stroke: #d97706; }
      .switch { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .link { stroke: #94a3b8; stroke-width: 5; fill: none; stroke-linecap: round; }
      .busy { stroke: #ef4444; stroke-width: 8; stroke-dasharray: 14 10; fill: none; stroke-linecap: round; opacity: 0.84; }
      .reserved { stroke: #2563eb; stroke-width: 8; fill: none; stroke-linecap: round; marker-end: url(#blueArrow); }
      .chosen { stroke: #16a34a; stroke-width: 8; fill: none; stroke-linecap: round; marker-end: url(#greenArrow); }
      .ctrlLine { stroke: #d97706; stroke-width: 3; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .h1 { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .h2 { font: 700 19px Arial, sans-serif; fill: #0f172a; }
      .body { font: 15px Arial, sans-serif; fill: #334155; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .tiny { font: 12px Arial, sans-serif; fill: #64748b; }
      .label { font: 700 14px Arial, sans-serif; fill: #1e293b; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="680"/>
  <text class="h1" x="54" y="54">ARK：把 KV cache transfer 作为一等网络流调度</text>
  <text class="body" x="54" y="84">Prefill/Decode 分离后，首 token 延迟不只取决于 GPU 空闲度，还取决于 KV flow 是否在数据中心路径上互相碰撞。</text>

  <rect class="box control" x="370" y="112" width="460" height="120"/>
  <text class="h2" x="394" y="148">ARK control plane</text>
  <text class="body" x="394" y="178">维护候选 source paths、广播 reservation、避开重叠链路</text>
  <text class="small" x="394" y="206">输入：KV 大小 / request deadline / active path reservations</text>

  <rect class="box prefill" x="70" y="282" width="210" height="124"/>
  <text class="h2" x="98" y="318">Prefill GPU</text>
  <text class="body" x="98" y="350">prompt compute</text>
  <text class="body" x="98" y="378">生成 KV cache</text>

  <rect class="box decode" x="920" y="282" width="210" height="124"/>
  <text class="h2" x="948" y="318">Decode GPU</text>
  <text class="body" x="948" y="350">接收 KV cache</text>
  <text class="body" x="948" y="378">开始 token streaming</text>

  <circle class="switch" cx="410" cy="318" r="40"/>
  <text class="label" x="410" y="323" text-anchor="middle">ToR A</text>
  <circle class="switch" cx="600" cy="238" r="40"/>
  <text class="label" x="600" y="243" text-anchor="middle">Spine 1</text>
  <circle class="switch" cx="600" cy="448" r="40"/>
  <text class="label" x="600" y="453" text-anchor="middle">Spine 2</text>
  <circle class="switch" cx="790" cy="318" r="40"/>
  <text class="label" x="790" y="323" text-anchor="middle">ToR B</text>

  <path class="link" d="M280 344 C325 344 352 330 372 322"/>
  <path class="link" d="M448 300 C500 270 535 252 562 242"/>
  <path class="link" d="M448 338 C505 382 535 418 562 438"/>
  <path class="link" d="M638 242 C680 254 727 284 752 302"/>
  <path class="link" d="M638 438 C685 420 725 374 752 338"/>
  <path class="link" d="M830 318 C860 326 888 338 920 344"/>

  <path class="busy" d="M448 300 C500 270 535 252 562 242"/>
  <path class="busy" d="M638 242 C680 254 727 284 752 302"/>
  <text class="small" x="510" y="208" fill="#b91c1c">已有大 KV flow 占用</text>

  <path class="chosen" d="M280 344 C325 344 352 330 372 322"/>
  <path class="chosen" d="M448 338 C505 382 535 418 562 438"/>
  <path class="chosen" d="M638 438 C685 420 725 374 752 338"/>
  <path class="chosen" d="M830 318 C860 326 888 338 920 344"/>
  <text class="small" x="510" y="526" fill="#166534">ARK 选择 non-overlapped path 传输本次 KV</text>

  <path class="ctrlLine" d="M455 232 C430 250 415 270 410 278"/>
  <path class="ctrlLine" d="M745 232 C770 250 785 270 790 278"/>
  <path class="ctrlLine" d="M600 232 L600 282"/>
  <path class="ctrlLine" d="M600 232 L600 408"/>

  <rect x="70" y="500" width="330" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="h2" x="94" y="534">传统调度盲点</text>
  <text class="body" x="94" y="564">只看 decode worker 是否空闲</text>
  <text class="body" x="94" y="590">忽略中间链路碰撞与 FCT 尾部</text>

  <rect x="435" y="500" width="330" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="h2" x="459" y="534">ARK 增加的信号</text>
  <text class="body" x="459" y="564">KV flow size + path overlap</text>
  <text class="body" x="459" y="590">reserve / detect race / release</text>

  <rect x="800" y="500" width="330" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="h2" x="824" y="534">服务侧收益</text>
  <text class="body" x="824" y="564">降低 KV transfer completion time</text>
  <text class="body" x="824" y="590">压低 TTFT 与 P95/P99 延迟</text>
</svg>
