<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Fault tolerant LLM training at 100K GPU scale</title>
  <desc id="desc">A framework diagram showing healthy HSDP replicas continuing training while a failed replica is isolated, rebuilt from tiered checkpoints, and rejoined through non-blocking catch-up.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="recover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="checkpoint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 30px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}
      .subtitle{font:500 15px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}
      .panel{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.4;rx:18;filter:url(#shadow)}
      .soft{fill:#f8fafc;stroke:#dbeafe;stroke-width:1.2;rx:14}
      .boxTitle{font:700 17px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}
      .boxText{font:500 13px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}
      .tiny{font:500 12px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#64748b}
      .chip{font:700 12px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#ffffff}
      .line{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}
      .lineBlue{stroke:#2563eb;stroke-width:2.3;fill:none;marker-end:url(#arrowBlue)}
      .dash{stroke:#64748b;stroke-width:1.8;stroke-dasharray:7 7;fill:none;marker-end:url(#arrow)}
      .gpuBox{fill:url(#gpu);rx:10}
      .badBox{fill:url(#recover);rx:10}
      .ckptBox{fill:url(#checkpoint);rx:10}
    </style>
  </defs>

  <rect width="1120" height="640" fill="url(#bg)"/>
  <text x="54" y="58" class="title">100K GPU LLM 训练容错：把恢复从全局停机改成副本级流水线</text>
  <text x="56" y="88" class="subtitle">核心思想：健康 HSDP replica 继续训练，故障 replica 局部隔离、分层恢复、非阻塞追赶。</text>

  <rect x="48" y="126" width="660" height="270" class="panel"/>
  <text x="78" y="164" class="boxTitle">HSDP Replicas as Fault Domains</text>
  <text x="78" y="188" class="boxText">每个 replica 内部包含 TP / PP / EP / CP 等并行；跨 replica 只做数据并行梯度交换。</text>

  <rect x="84" y="222" width="142" height="90" class="soft"/>
  <text x="155" y="249" text-anchor="middle" class="boxTitle">Replica 0</text>
  <rect x="104" y="265" width="36" height="28" class="gpuBox"/>
  <rect x="146" y="265" width="36" height="28" class="gpuBox"/>
  <rect x="188" y="265" width="18" height="28" class="gpuBox"/>
  <text x="155" y="332" text-anchor="middle" class="tiny">healthy, keep training</text>

  <rect x="270" y="222" width="142" height="90" class="soft"/>
  <text x="341" y="249" text-anchor="middle" class="boxTitle">Replica 1</text>
  <rect x="290" y="265" width="36" height="28" class="gpuBox"/>
  <rect x="332" y="265" width="36" height="28" class="gpuBox"/>
  <rect x="374" y="265" width="18" height="28" class="gpuBox"/>
  <text x="341" y="332" text-anchor="middle" class="tiny">healthy, keep training</text>

  <rect x="456" y="222" width="142" height="90" class="soft"/>
  <text x="527" y="249" text-anchor="middle" class="boxTitle">Replica 2</text>
  <rect x="476" y="265" width="36" height="28" class="badBox"/>
  <rect x="518" y="265" width="36" height="28" fill="#fed7aa" rx="10"/>
  <rect x="560" y="265" width="18" height="28" fill="#fed7aa" rx="10"/>
  <text x="527" y="332" text-anchor="middle" class="tiny">isolate and rebuild</text>

  <path d="M226 267 H270" class="lineBlue"/>
  <path d="M412 267 H456" class="lineBlue"/>
  <text x="343" y="214" text-anchor="middle" class="tiny">FTAR gradient exchange across same ranks</text>
  <text x="78" y="366" class="boxText">故障发生后，只有包含坏 GPU 的 replica 下线；其他 replica 保留显存状态并继续 step。</text>

  <rect x="760" y="126" width="312" height="270" class="panel"/>
  <text x="790" y="164" class="boxTitle">Fast Diagnosis and Isolation</text>
  <rect x="794" y="198" width="230" height="44" class="soft"/>
  <text x="909" y="225" text-anchor="middle" class="boxText">collective telemetry / wait-for graph</text>
  <rect x="794" y="257" width="230" height="44" class="soft"/>
  <text x="909" y="284" text-anchor="middle" class="boxText">stack trace clustering / MFU drop</text>
  <rect x="794" y="316" width="230" height="44" class="soft"/>
  <text x="909" y="343" text-anchor="middle" class="boxText">over-evict suspect PP/TP/DP group</text>
  <path d="M598 267 C674 267 690 257 760 257" class="dash"/>

  <rect x="72" y="462" width="314" height="122" class="panel"/>
  <text x="102" y="500" class="boxTitle">Tiered Checkpoint Path</text>
  <rect x="104" y="524" width="72" height="34" class="ckptBox"/>
  <text x="140" y="546" text-anchor="middle" class="chip">local</text>
  <rect x="206" y="524" width="72" height="34" class="ckptBox"/>
  <text x="242" y="546" text-anchor="middle" class="chip">peer</text>
  <rect x="308" y="524" width="52" height="34" fill="#94a3b8" rx="10"/>
  <text x="334" y="546" text-anchor="middle" class="chip">remote</text>
  <text x="102" y="572" class="tiny">differential checkpoint + cross-parallel-group backup + async migration</text>

  <rect x="452" y="462" width="286" height="122" class="panel"/>
  <text x="482" y="500" class="boxTitle">Non-blocking Catch-up</text>
  <text x="482" y="528" class="boxText">1. recovering replica loads latest state</text>
  <text x="482" y="552" class="boxText">2. healthy replicas keep processing data</text>
  <text x="482" y="576" class="boxText">3. zero gradient aligns step boundary</text>

  <rect x="804" y="462" width="236" height="122" class="panel"/>
  <text x="834" y="500" class="boxTitle">Training Outcome</text>
  <text x="834" y="530" class="boxText">failure stall shrinks</text>
  <text x="834" y="554" class="boxText">effective training time rises</text>
  <text x="834" y="578" class="boxText">most GPUs stay productive</text>

  <path d="M386 523 H452" class="line"/>
  <path d="M738 523 H804" class="line"/>
  <path d="M527 312 C527 407 286 414 229 462" class="dash"/>
  <path d="M595 462 C620 415 638 374 641 324" class="dash"/>
</svg>
