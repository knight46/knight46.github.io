<svg xmlns="http://www.w3.org/2000/svg" width="960" height="980" viewBox="0 0 960 980" role="img" aria-labelledby="title desc">
  <title id="title">逐 token host 控制环与 GPU-resident scheduling 时间线</title>
  <desc id="desc">上半部分展示传统 overlapped scheduling 中正常 host 工作可被 GPU iteration 隐藏，但 CPU jitter 溢出后形成 GPU 空洞；下半部分展示 GPU 常驻调度器与 device-side graph launch 让 decode iteration 连续推进。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cbd5e1"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
      .bg { fill: #0b1220; }
      .panel { fill: #111c2f; stroke: #334155; stroke-width: 2; }
      .title { fill: #f8fafc; font-size: 32px; font-weight: 700; }
      .subtitle { fill: #cbd5e1; font-size: 19px; }
      .section { fill: #f8fafc; font-size: 27px; font-weight: 700; }
      .label { fill: #f8fafc; font-size: 20px; font-weight: 650; }
      .small { fill: #cbd5e1; font-size: 17px; }
      .tiny { fill: #dbeafe; font-size: 15px; }
      .axis { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .guide { stroke: #334155; stroke-width: 2; stroke-dasharray: 7 7; }
      .gpu { fill: #3730a3; stroke: #818cf8; stroke-width: 2; }
      .host { fill: #7c2d12; stroke: #fb923c; stroke-width: 2; }
      .hidden { fill: #0f766e; stroke: #2dd4bf; stroke-width: 2; }
      .gap { fill: #7f1d1d; stroke: #f87171; stroke-width: 2; }
      .resident { fill: #164e63; stroke: #22d3ee; stroke-width: 2; }
      .note { fill: #17243a; stroke: #64748b; stroke-width: 2; }
      .risk-text { fill: #fecaca; font-size: 18px; font-weight: 650; }
      .ok-text { fill: #99f6e4; font-size: 18px; font-weight: 650; }
    </style>
  </defs>
  <rect class="bg" width="960" height="980" rx="24"/>
  <text class="title" x="48" y="62">逐 Token 控制环：隐藏窗口不是无限的</text>
  <text class="subtitle" x="48" y="94">时间从左向右；矩形宽度表示工作持续时间，示意图不按实验比例绘制</text>
  <rect class="panel" x="34" y="124" width="892" height="390" rx="22"/>
  <text class="section" x="62" y="168">A. Host-driven + overlapped scheduling</text>
  <text class="label" x="62" y="225">GPU</text>
  <text class="label" x="62" y="333">Host</text>
  <path class="axis" d="M142 190 H884"/>
  <line class="guide" x1="334" y1="201" x2="334" y2="403"/>
  <line class="guide" x1="526" y1="201" x2="526" y2="403"/>
  <line class="guide" x1="718" y1="201" x2="718" y2="403"/>
  <rect class="gpu" x="142" y="236" width="192" height="66" rx="10"/>
  <text class="label" x="238" y="266" text-anchor="middle">Decode 0</text>
  <text class="tiny" x="238" y="289" text-anchor="middle">Graph / Kernels</text>
  <rect class="gpu" x="334" y="236" width="192" height="66" rx="10"/>
  <text class="label" x="430" y="266" text-anchor="middle">Decode 1</text>
  <text class="tiny" x="430" y="289" text-anchor="middle">Graph / Kernels</text>
  <rect class="gap" x="526" y="236" width="112" height="66" rx="10"/>
  <text class="label" x="582" y="266" text-anchor="middle">GPU 空洞</text>
  <text class="tiny" x="582" y="289" text-anchor="middle">等待 host</text>
  <rect class="gpu" x="638" y="236" width="192" height="66" rx="10"/>
  <text class="label" x="734" y="266" text-anchor="middle">Decode 2</text>
  <text class="tiny" x="734" y="289" text-anchor="middle">延迟后启动</text>
  <rect class="hidden" x="182" y="344" width="122" height="54" rx="9"/>
  <text class="small" x="243" y="376" text-anchor="middle">正常调度</text>
  <rect class="host" x="374" y="344" width="264" height="54" rx="9"/>
  <text class="small" x="506" y="368" text-anchor="middle">Host work + CPU jitter</text>
  <text class="tiny" x="506" y="389" text-anchor="middle">超出 Decode 1 的隐藏窗口</text>
  <path d="M182 409 H304" stroke="#2dd4bf" stroke-width="4" fill="none"/>
  <text class="small" x="243" y="437" text-anchor="middle">被隐藏</text>
  <path d="M526 409 H638" stroke="#f87171" stroke-width="4" fill="none"/>
  <text class="risk-text" x="582" y="437" text-anchor="middle">暴露为逐 token 延迟</text>
  <rect class="note" x="62" y="458" width="826" height="37" rx="9"/>
  <text class="small" x="475" y="483" text-anchor="middle">CUDA Graph 缩短 launch 序列，但 batch / KV metadata / 下一轮推进仍依赖 host</text>
  <rect class="panel" x="34" y="540" width="892" height="380" rx="22"/>
  <text class="section" x="62" y="584">B. Blink：GPU-resident scheduler</text>
  <text class="label" x="62" y="641">Control</text>
  <text class="label" x="62" y="749">GPU</text>
  <path class="axis" d="M142 606 H884"/>
  <line class="guide" x1="334" y1="618" x2="334" y2="812"/>
  <line class="guide" x1="526" y1="618" x2="526" y2="812"/>
  <line class="guide" x1="718" y1="618" x2="718" y2="812"/>
  <rect class="resident" x="142" y="652" width="688" height="55" rx="10"/>
  <text class="label" x="486" y="677" text-anchor="middle">Persistent Scheduler + Device-side Graph Launch</text>
  <text class="tiny" x="486" y="698" text-anchor="middle">扫描 ring · 更新 batch / KV state · completion polling</text>
  <rect class="gpu" x="142" y="760" width="192" height="66" rx="10"/>
  <text class="label" x="238" y="799" text-anchor="middle">Decode 0</text>
  <rect class="gpu" x="334" y="760" width="192" height="66" rx="10"/>
  <text class="label" x="430" y="799" text-anchor="middle">Decode 1</text>
  <rect class="gpu" x="526" y="760" width="192" height="66" rx="10"/>
  <text class="label" x="622" y="799" text-anchor="middle">Decode 2</text>
  <rect class="gpu" x="718" y="760" width="112" height="66" rx="10"/>
  <text class="label" x="774" y="799" text-anchor="middle">…</text>
  <rect class="note" x="62" y="850" width="826" height="48" rx="9"/>
  <text class="ok-text" x="475" y="880" text-anchor="middle">调度状态与 KV state 同在 GPU；host 抖动不再穿透稳态 decode loop</text>
  <text class="small" x="48" y="954">关键权衡：减少 host 空洞，但增加 persistent kernel、polling、graph cache 与设备侧恢复成本。</text>
</svg>
