<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Double-buffered GEMM mainloop timeline</title>
<desc id="desc">Stages 0 and 1 alternate asynchronous copies, barriers, register loads, and matrix multiply-accumulate operations.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071727"/><stop offset="1" stop-color="#15314b"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c6ddf3"/></marker>
  <style>
   .title{font:700 42px Arial,"Noto Sans SC",sans-serif;fill:#f6fbff}.sub{font:400 22px Arial,"Noto Sans SC",sans-serif;fill:#bed3e8}.label{font:700 25px Arial,"Noto Sans SC",sans-serif;fill:#f5fbff}.small{font:600 20px Arial,"Noto Sans SC",sans-serif;fill:#10253a}.tick{font:600 19px Arial,"Noto Sans SC",sans-serif;fill:#bcd1e8}.note{font:400 21px Arial,"Noto Sans SC",sans-serif;fill:#dcecff}.axis{stroke:#9bb8d3;stroke-width:3;marker-end:url(#arrow)}.grid{stroke:#5a7792;stroke-width:1;stroke-dasharray:6 8;opacity:.65}
  </style>
</defs>
<rect width="1200" height="900" rx="28" fill="url(#bg)"/>
<text x="600" y="62" text-anchor="middle" class="title">Double-Buffered GEMM Mainloop</text>
<text x="600" y="98" text-anchor="middle" class="sub">Producer fills the next stage while consumer computes on the current stage</text>

<line x1="260" y1="155" x2="1120" y2="155" class="axis"/>
<text x="110" y="163" class="label">Time</text>
<g class="tick" text-anchor="middle"><text x="325" y="143">t0</text><text x="515" y="143">t1</text><text x="705" y="143">t2</text><text x="895" y="143">t3</text><text x="1085" y="143">t4</text></g>
<g><line x1="420" y1="174" x2="420" y2="720" class="grid"/><line x1="610" y1="174" x2="610" y2="720" class="grid"/><line x1="800" y1="174" x2="800" y2="720" class="grid"/><line x1="990" y1="174" x2="990" y2="720" class="grid"/></g>

<text x="70" y="236" class="label">Producer</text><text x="70" y="268" class="sub">GMem → SMem</text>
<rect x="270" y="202" width="280" height="76" rx="14" fill="#4fc3f7"/><text x="410" y="232" text-anchor="middle" class="small">Copy K0 → Stage 0</text><text x="410" y="259" text-anchor="middle" class="small">Async issue</text>
<rect x="570" y="202" width="280" height="76" rx="14" fill="#65d6a6"/><text x="710" y="232" text-anchor="middle" class="small">Copy K1 → Stage 1</text><text x="710" y="259" text-anchor="middle" class="small">Overlaps K0 compute</text>
<rect x="870" y="202" width="250" height="76" rx="14" fill="#4fc3f7"/><text x="995" y="232" text-anchor="middle" class="small">Copy K2 → Stage 0</text><text x="995" y="259" text-anchor="middle" class="small">Reuse released stage</text>

<text x="70" y="365" class="label">Barrier</text><text x="70" y="397" class="sub">Publish / Wait</text>
<rect x="490" y="333" width="120" height="66" rx="13" fill="#f6c85f"/><text x="550" y="374" text-anchor="middle" class="small">S0 ready</text>
<rect x="790" y="333" width="120" height="66" rx="13" fill="#f6c85f"/><text x="850" y="374" text-anchor="middle" class="small">S1 ready</text>
<path d="M550 278V325" class="axis"/><path d="M850 278V325" class="axis"/>

<text x="70" y="493" class="label">Consumer</text><text x="70" y="525" class="sub">SMem → Reg</text>
<rect x="510" y="462" width="200" height="68" rx="13" fill="#b39ddb"/><text x="610" y="503" text-anchor="middle" class="small">Load fragment K0</text>
<rect x="810" y="462" width="200" height="68" rx="13" fill="#b39ddb"/><text x="910" y="503" text-anchor="middle" class="small">Load fragment K1</text>
<path d="M610 399V454" class="axis"/><path d="M850 399V432Q850 446 870 454" class="axis"/>

<text x="70" y="618" class="label">Tensor Core</text><text x="70" y="650" class="sub">Reg → Accum</text>
<rect x="570" y="585" width="280" height="76" rx="14" fill="#ff8a80"/><text x="710" y="615" text-anchor="middle" class="small">MMA K0</text><text x="710" y="643" text-anchor="middle" class="small">accum += A0 × B0</text>
<rect x="870" y="585" width="250" height="76" rx="14" fill="#ffab91"/><text x="995" y="615" text-anchor="middle" class="small">MMA K1</text><text x="995" y="643" text-anchor="middle" class="small">accum += A1 × B1</text>
<path d="M610 530V577" class="axis"/><path d="M910 530V555Q910 567 940 577" class="axis"/>

<g><rect x="260" y="727" width="880" height="122" rx="18" fill="#173b59" stroke="#557b9e" stroke-width="2"/>
<circle cx="300" cy="767" r="12" fill="#4fc3f7"/><text x="325" y="774" class="note">Blue / green: shared-memory stages alternate as producer targets</text>
<circle cx="300" cy="812" r="12" fill="#ff8a80"/><text x="325" y="819" class="note">Red: MMA consumes current stage; producer overwrites only after release</text></g>
</svg>
