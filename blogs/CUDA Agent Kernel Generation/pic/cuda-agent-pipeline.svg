<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">CUDA Agent 系统框架图</title>
  <desc id="desc">展示 CUDA Agent 从任务合成、执行环境、强化学习训练到 KernelBench 评测的流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#cbd5e1"/>
    </marker>
    <style>
      .title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}
      .subtitle{font:500 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}
      .box-title{font:700 20px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}
      .box-text{font:500 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#dbeafe}
      .small{font:500 13px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}
      .metric{font:800 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#ffffff}
      .line{stroke:#cbd5e1;stroke-width:3;fill:none;marker-end:url(#arrow);opacity:.9}
      .dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 8;fill:none;opacity:.75}
    </style>
  </defs>

  <rect width="1120" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="70" r="110" fill="#2563eb" opacity="0.18"/>
  <circle cx="95" cy="540" r="150" fill="#10b981" opacity="0.12"/>

  <text x="56" y="62" class="title">CUDA Agent：把 CUDA 优化训练成可验证的长期任务</text>
  <text x="56" y="92" class="subtitle">核心不是一次性生成代码，而是用合成任务、受保护执行环境和 RL 让模型学会 profiling → coding → verification → iteration。</text>

  <g filter="url(#shadow)">
    <rect x="56" y="140" width="250" height="150" rx="22" fill="url(#green)"/>
    <text x="82" y="178" class="box-title">1. 任务合成</text>
    <text x="82" y="210" class="box-text">PyTorch / Transformers 种子算子</text>
    <text x="82" y="236" class="box-text">组合成融合 workload</text>
    <text x="82" y="262" class="box-text">执行过滤、去随机、控规模</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="435" y="140" width="250" height="150" rx="22" fill="url(#blue)"/>
    <text x="461" y="178" class="box-title">2. CUDA Agent 环境</text>
    <text x="461" y="210" class="box-text">SKILL.md 固化开发流程</text>
    <text x="461" y="236" class="box-text">编译、正确性、profiling 反馈</text>
    <text x="461" y="262" class="box-text">隔离权限与反 reward hacking</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="814" y="140" width="250" height="150" rx="22" fill="url(#purple)"/>
    <text x="840" y="178" class="box-title">3. 长程 RL 训练</text>
    <text x="840" y="210" class="box-text">单轮 warm-up</text>
    <text x="840" y="236" class="box-text">RFT 初始化 actor</text>
    <text x="840" y="262" class="box-text">critic 预训练 + 多轮 PPO</text>
  </g>

  <path class="line" d="M306 215 C350 215 385 215 425 215"/>
  <path class="line" d="M685 215 C729 215 764 215 804 215"/>

  <g filter="url(#shadow)">
    <rect x="160" y="370" width="800" height="150" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="198" y="408" class="box-title">KernelBench / torch.compile 对照评测</text>
    <text x="198" y="438" class="small">每个候选 kernel 必须同时满足：随机输入正确性、同步 warm-up 后计时、相比 PyTorch/torch.compile 的真实加速。</text>

    <text x="230" y="490" class="metric">98.8%</text>
    <text x="220" y="514" class="small">overall pass rate</text>
    <text x="490" y="490" class="metric">96.8%</text>
    <text x="470" y="514" class="small">faster than torch.compile</text>
    <text x="760" y="490" class="metric">2.11×</text>
    <text x="744" y="514" class="small">overall speedup</text>
  </g>

  <path class="dash" d="M560 290 V360"/>
  <path class="line" d="M560 300 V360"/>

  <text x="56" y="582" class="small">图注：数值来自 CUDA Agent 项目页；框架图为本文自绘，用于说明系统路径，不代表原论文图。</text>
</svg>
