<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1040" viewBox="0 0 960 1040" role="img" aria-labelledby="title desc">
  <title id="title">CUDA 原子操作：先选作用域，再选内存顺序</title>
  <desc id="desc">上半部分按通信距离选择最窄作用域，下半部分按语义选择最弱内存顺序，底部列出常见组合。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .title{font:700 32px system-ui,sans-serif;fill:#0f172a}
      .subtitle{font:400 21px system-ui,sans-serif;fill:#475569}
      .section{font:700 27px system-ui,sans-serif;fill:#0f172a}
      .label{font:700 24px system-ui,sans-serif;fill:#0f172a}
      .body{font:400 21px system-ui,sans-serif;fill:#334155}
      .small{font:600 19px system-ui,sans-serif;fill:#334155}
      .edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}
      .blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2}
      .indigo{fill:#e0e7ff;stroke:#4f46e5;stroke-width:2}
      .teal{fill:#ccfbf1;stroke:#0f766e;stroke-width:2}
      .amber{fill:#fef3c7;stroke:#d97706;stroke-width:2}
      .red{fill:#fee2e2;stroke:#dc2626;stroke-width:2}
      .green{fill:#dcfce7;stroke:#16a34a;stroke-width:2}
      .chip{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="960" height="1040"/>
  <text class="title" x="48" y="58">CUDA 原子操作：Scope × Order</text>
  <text class="subtitle" x="48" y="91">先覆盖通信双方，再选择能证明 happens-before 的最弱顺序</text>

  <rect class="panel" x="36" y="120" width="888" height="330" rx="20"/>
  <text class="section" x="64" y="163">① 通信最远到哪里？选择最窄且覆盖双方的 Scope</text>

  <!-- connectors behind nodes -->
  <path class="edge" d="M225 260 H273"/>
  <path class="edge" d="M430 260 H478"/>
  <path class="edge" d="M635 260 H683"/>

  <!-- scope nodes -->
  <rect class="blue" x="68" y="205" width="157" height="110" rx="15"/>
  <text class="label" x="146.5" y="244" text-anchor="middle">block</text>
  <text class="body" x="146.5" y="278" text-anchor="middle">同一 block</text>

  <rect class="indigo" x="273" y="205" width="157" height="110" rx="15"/>
  <text class="label" x="351.5" y="244" text-anchor="middle">cluster</text>
  <text class="body" x="351.5" y="278" text-anchor="middle">同一 cluster</text>

  <rect class="teal" x="478" y="205" width="157" height="110" rx="15"/>
  <text class="label" x="556.5" y="244" text-anchor="middle">device</text>
  <text class="body" x="556.5" y="278" text-anchor="middle">同一 GPU</text>

  <rect class="amber" x="683" y="205" width="173" height="110" rx="15"/>
  <text class="label" x="769.5" y="244" text-anchor="middle">system</text>
  <text class="body" x="769.5" y="278" text-anchor="middle">CPU / 多 GPU</text>

  <rect class="red" x="68" y="344" width="788" height="72" rx="14"/>
  <text class="label" x="92" y="375">错误信号</text>
  <text class="body" x="232" y="375">跨 block 却用 block scope；system scope 但内存/平台不支持</text>
  <text class="small" x="92" y="402">scope 过窄会断开同步；scope 变宽也不会创造地址可达性。</text>

  <rect class="panel" x="36" y="478" width="888" height="348" rx="20"/>
  <text class="section" x="64" y="521">② 原子值是否承载其他数据的发布？选择 Order</text>

  <!-- order connectors behind nodes -->
  <path class="edge" d="M273 621 H317"/>
  <path class="edge" d="M642 621 H686"/>

  <rect class="blue" x="68" y="559" width="205" height="124" rx="15"/>
  <text class="label" x="170.5" y="598" text-anchor="middle">只要原子性</text>
  <text class="label" x="170.5" y="633" text-anchor="middle">relaxed</text>
  <text class="small" x="170.5" y="662" text-anchor="middle">计数 / 索引分配</text>

  <rect class="green" x="317" y="559" width="325" height="124" rx="15"/>
  <text class="label" x="479.5" y="598" text-anchor="middle">发布 / 消费 payload</text>
  <text class="label" x="479.5" y="633" text-anchor="middle">release → acquire</text>
  <text class="small" x="479.5" y="662" text-anchor="middle">由 carrier atomic 建立同步</text>

  <rect class="amber" x="686" y="559" width="170" height="124" rx="15"/>
  <text class="label" x="771" y="598" text-anchor="middle">RMW 双向</text>
  <text class="label" x="771" y="633" text-anchor="middle">acq_rel</text>
  <text class="small" x="771" y="662" text-anchor="middle">接棒状态机</text>

  <rect class="chip" x="68" y="714" width="788" height="78" rx="14"/>
  <text class="label" x="92" y="746">确实需要单一全序：</text>
  <text class="label" x="350" y="746">seq_cst</text>
  <text class="body" x="92" y="778">更强 order 不能修复 scope 过窄、生命周期错误或 data race。</text>

  <rect class="panel" x="36" y="854" width="888" height="150" rx="20"/>
  <text class="section" x="64" y="890">最小充分组合示例</text>
  <text class="small" x="64" y="926">同 block 计数：block + relaxed</text>
  <text class="small" x="64" y="958">跨 block 发布：device + release/acquire</text>
  <text class="small" x="64" y="990">CPU–GPU 通信：system + 内存/平台能力检查</text>
</svg>
