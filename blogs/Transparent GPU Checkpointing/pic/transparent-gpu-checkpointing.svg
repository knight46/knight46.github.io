<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Transparent GPU checkpoint and restore pipeline</title>
  <desc id="desc">A framework diagram showing a scheduler-triggered transparent CPU and GPU checkpoint pipeline with CRIU and GPU driver plugins.</desc>
  <defs>
    <linearGradient id="hostGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="gpuGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="controlGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="980" height="560" fill="#f8fafc"/>
  <rect x="42" y="36" width="896" height="488" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#softShadow)"/>

  <text x="72" y="82" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Transparent GPU Checkpointing</text>
  <text x="72" y="112" font-family="Arial, sans-serif" font-size="15" fill="#475569">Snapshot CPU process state and GPU driver state together, without rewriting the training application.</text>

  <rect x="78" y="158" width="206" height="106" rx="8" fill="url(#controlGrad)" stroke="#94a3b8"/>
  <text x="102" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Scheduler</text>
  <text x="102" y="218" font-family="Arial, sans-serif" font-size="13" fill="#334155">preemption</text>
  <text x="102" y="241" font-family="Arial, sans-serif" font-size="13" fill="#334155">migration</text>

  <rect x="350" y="146" width="280" height="132" rx="8" fill="url(#hostGrad)" stroke="#60a5fa"/>
  <text x="378" y="180" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Container workload</text>
  <rect x="378" y="204" width="96" height="42" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="401" y="230" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">PyTorch</text>
  <rect x="492" y="204" width="110" height="42" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="515" y="230" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">CUDA API</text>

  <rect x="696" y="146" width="188" height="132" rx="8" fill="url(#gpuGrad)" stroke="#22c55e"/>
  <text x="724" y="180" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">GPU state</text>
  <text x="724" y="212" font-family="Arial, sans-serif" font-size="13" fill="#166534">VRAM pages</text>
  <text x="724" y="235" font-family="Arial, sans-serif" font-size="13" fill="#166534">contexts, queues</text>
  <text x="724" y="258" font-family="Arial, sans-serif" font-size="13" fill="#166534">driver metadata</text>

  <path d="M 284 211 L 340 211" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 630 211 L 686 211" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="116" y="344" width="188" height="96" rx="8" fill="#fefce8" stroke="#eab308"/>
  <text x="140" y="374" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#713f12">1. Quiesce GPU</text>
  <text x="140" y="401" font-family="Arial, sans-serif" font-size="13" fill="#854d0e">lock new CUDA calls</text>
  <text x="140" y="424" font-family="Arial, sans-serif" font-size="13" fill="#854d0e">drain in-flight work</text>

  <rect x="392" y="344" width="196" height="96" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="416" y="374" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#312e81">2. Unified dump</text>
  <text x="416" y="401" font-family="Arial, sans-serif" font-size="13" fill="#4338ca">CRIU saves CPU state</text>
  <text x="416" y="424" font-family="Arial, sans-serif" font-size="13" fill="#4338ca">plugin saves GPU state</text>

  <rect x="676" y="344" width="188" height="96" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="700" y="374" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#14532d">3. Restore</text>
  <text x="700" y="401" font-family="Arial, sans-serif" font-size="13" fill="#166534">recreate process tree</text>
  <text x="700" y="424" font-family="Arial, sans-serif" font-size="13" fill="#166534">reload GPU context</text>

  <path d="M 210 264 C 210 300, 210 316, 210 334" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M 304 392 L 382 392" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 588 392 L 666 392" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 770 344 C 770 314, 740 300, 694 278" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <rect x="382" y="472" width="216" height="42" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="410" y="498" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412">checkpoint image / registry / shared storage</text>

  <path d="M 490 440 L 490 462" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 598 493 C 650 493, 688 468, 724 442" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="72" y="548" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Key idea: move checkpoint control below the ML framework while preserving a consistent CPU-GPU snapshot boundary.</text>
</svg>
