<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
  <title id="title">ParallelKittens 多 GPU kernel 框架图</title>
  <desc id="desc">图中展示 host 预先建立跨进程 GPU 内存映射，多个 GPU kernel 以 tile 为粒度通过 NVLink/NVSwitch 通信，并用 producer、consumer、finish 流水线重叠通信与计算。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#182033"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0" x2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#bae6fd"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1120" height="630" rx="28" fill="url(#bg)"/>
  <text x="56" y="62" fill="#f8fafc" font-size="30" font-family="Inter, system-ui, sans-serif" font-weight="700">ParallelKittens：把多 GPU 通信写进 CUDA kernel</text>
  <text x="56" y="96" fill="#cbd5e1" font-size="16" font-family="Inter, system-ui, sans-serif">预映射 peer memory + tile 级网络原语 + kernel 内流水线调度</text>

  <rect x="54" y="130" width="1012" height="86" rx="18" fill="#111827" stroke="#334155"/>
  <text x="78" y="162" fill="#e0f2fe" font-size="18" font-family="Inter, system-ui, sans-serif" font-weight="700">Host / runtime setup（慢路径，执行前完成）</text>
  <text x="78" y="192" fill="#cbd5e1" font-size="15" font-family="Inter, system-ui, sans-serif">CUDA IPC / VMM / multicast object 建立跨进程虚拟地址映射；训练或推理主循环中避免反复做 OS IPC。</text>

  <rect x="435" y="265" width="250" height="100" rx="22" fill="url(#fabric)" filter="url(#shadow)"/>
  <text x="560" y="306" text-anchor="middle" fill="#052e16" font-size="24" font-family="Inter, system-ui, sans-serif" font-weight="800">NVLink / NVSwitch</text>
  <text x="560" y="334" text-anchor="middle" fill="#064e3b" font-size="15" font-family="Inter, system-ui, sans-serif">peer load/store · multicast · reduction</text>

  <g filter="url(#shadow)">
    <rect x="70" y="250" width="270" height="270" rx="24" fill="url(#gpu)"/>
    <rect x="780" y="250" width="270" height="270" rx="24" fill="url(#gpu)"/>
  </g>
  <text x="205" y="286" text-anchor="middle" fill="#eff6ff" font-size="22" font-family="Inter, system-ui, sans-serif" font-weight="800">GPU 0 kernel</text>
  <text x="915" y="286" text-anchor="middle" fill="#eff6ff" font-size="22" font-family="Inter, system-ui, sans-serif" font-weight="800">GPU 1 kernel</text>

  <g font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">
    <rect x="98" y="318" width="214" height="42" rx="12" fill="#dbeafe"/><text x="205" y="345" text-anchor="middle" fill="#1e3a8a">1. load tile</text>
    <rect x="98" y="374" width="214" height="42" rx="12" fill="#ede9fe"/><text x="205" y="401" text-anchor="middle" fill="#4c1d95">2. compute on tensor cores</text>
    <rect x="98" y="430" width="214" height="42" rx="12" fill="#cffafe"/><text x="205" y="457" text-anchor="middle" fill="#155e75">3. send / reduce tile</text>

    <rect x="808" y="318" width="214" height="42" rx="12" fill="#dbeafe"/><text x="915" y="345" text-anchor="middle" fill="#1e3a8a">1. load tile</text>
    <rect x="808" y="374" width="214" height="42" rx="12" fill="#ede9fe"/><text x="915" y="401" text-anchor="middle" fill="#4c1d95">2. compute on tensor cores</text>
    <rect x="808" y="430" width="214" height="42" rx="12" fill="#cffafe"/><text x="915" y="457" text-anchor="middle" fill="#155e75">3. receive / finish tile</text>
  </g>

  <path d="M340 385 C410 340 435 327 435 327" stroke="#bae6fd" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M685 327 C725 340 750 365 780 385" stroke="#bae6fd" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M780 440 C725 493 397 493 340 440" stroke="#a7f3d0" stroke-width="4" stroke-dasharray="10 8" fill="none" marker-end="url(#arrow)"/>

  <rect x="372" y="430" width="376" height="95" rx="18" fill="#0b1220" stroke="#334155"/>
  <text x="560" y="462" text-anchor="middle" fill="#fef3c7" font-size="18" font-family="Inter, system-ui, sans-serif" font-weight="700">核心设计问题</text>
  <text x="560" y="493" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Inter, system-ui, sans-serif">通信粒度、发起机制、SM/warp 资源分配、</text>
  <text x="560" y="516" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Inter, system-ui, sans-serif">以及把 tensor cores 保持在忙碌状态</text>

  <text x="70" y="575" fill="#94a3b8" font-size="14" font-family="Inter, system-ui, sans-serif">示意图为本文自绘：抽象自 ParallelKittens / ThunderKittens 的多 GPU kernel 设计。</text>
</svg>
