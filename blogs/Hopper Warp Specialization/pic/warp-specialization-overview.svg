<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
  <title id="title">Uniform warps compared with Hopper warp specialization</title>
  <desc id="desc">Uniform warps alternate loading and matrix operations. A specialized producer instead feeds a shared-memory ring with TMA while a consumer warp group executes WGMMA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111d32"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="cyanArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#59dbe8"/></marker>
    <marker id="goldArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#ffc857"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#edf7ff}
      .panel{fill:#0c182a;stroke:#30445e;stroke-width:2}
      .head{font-size:40px;font-weight:750}.panelHead{font-size:33px;font-weight:750}
      .sub{font-size:27px;fill:#b8c9da}.label{font-size:28px;font-weight:680}.boxText{font-size:25px;font-weight:650}
      .load{fill:#173f55;stroke:#59dbe8;stroke-width:2}.mma{fill:#4c3915;stroke:#ffc857;stroke-width:2}
      .idle{fill:#351d35;stroke:#d584d8;stroke-width:2;stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="960" height="760" rx="28" fill="url(#bg)"/>
  <text x="480" y="52" text-anchor="middle" class="head">Uniform vs. Warp-Specialized Mainloop</text>
  <text x="480" y="88" text-anchor="middle" class="sub">Overlap TMA data movement with WGMMA compute</text>

  <rect x="28" y="118" width="434" height="595" rx="24" class="panel" filter="url(#shadow)"/>
  <text x="55" y="165" class="panelHead">Uniform warps</text>
  <text x="55" y="202" class="sub">Every warp switches roles</text>
  <text x="55" y="252" class="label">time →</text>
  <g transform="translate(55 278)">
    <text x="0" y="37" class="label">W0</text>
    <rect x="62" y="0" width="105" height="58" rx="10" class="load"/><text x="114" y="38" text-anchor="middle" class="boxText">Load</text>
    <rect x="180" y="0" width="70" height="58" rx="10" class="idle"/><text x="215" y="38" text-anchor="middle" class="boxText">Wait</text>
    <rect x="263" y="0" width="112" height="58" rx="10" class="mma"/><text x="319" y="38" text-anchor="middle" class="boxText">MMA</text>
    <text x="0" y="122" class="label">W1</text>
    <rect x="62" y="85" width="105" height="58" rx="10" class="load"/><text x="114" y="123" text-anchor="middle" class="boxText">Load</text>
    <rect x="180" y="85" width="70" height="58" rx="10" class="idle"/><text x="215" y="123" text-anchor="middle" class="boxText">Wait</text>
    <rect x="263" y="85" width="112" height="58" rx="10" class="mma"/><text x="319" y="123" text-anchor="middle" class="boxText">MMA</text>
    <text x="0" y="207" class="label">W2</text>
    <rect x="62" y="170" width="105" height="58" rx="10" class="load"/><text x="114" y="208" text-anchor="middle" class="boxText">Load</text>
    <rect x="180" y="170" width="70" height="58" rx="10" class="idle"/><text x="215" y="208" text-anchor="middle" class="boxText">Wait</text>
    <rect x="263" y="170" width="112" height="58" rx="10" class="mma"/><text x="319" y="208" text-anchor="middle" class="boxText">MMA</text>
  </g>
  <rect x="55" y="550" width="380" height="125" rx="16" fill="#151f32" stroke="#435773" stroke-width="2"/>
  <circle cx="80" cy="588" r="8" fill="#d584d8"/><text x="101" y="597" class="sub">Block-wide wait bubbles</text>
  <circle cx="80" cy="635" r="8" fill="#d584d8"/><text x="101" y="644" class="sub">Shared register budget</text>

  <rect x="498" y="118" width="434" height="595" rx="24" class="panel" filter="url(#shadow)"/>
  <text x="525" y="165" class="panelHead">Specialized CTA</text>
  <text x="525" y="202" class="sub">Persistent asynchronous roles</text>

  <rect x="530" y="252" width="165" height="100" rx="17" fill="#12394c" stroke="#59dbe8" stroke-width="3"/>
  <text x="612" y="294" text-anchor="middle" class="label">Producer</text>
  <text x="612" y="329" text-anchor="middle" class="sub">TMA · low regs</text>
  <path d="M695 302H748" stroke="#59dbe8" stroke-width="5" marker-end="url(#cyanArrow)"/>

  <rect x="765" y="230" width="140" height="145" rx="17" fill="#17283b" stroke="#7a98b8" stroke-width="3"/>
  <text x="835" y="270" text-anchor="middle" class="label">SMEM</text>
  <rect x="785" y="295" width="28" height="45" rx="6" fill="#59dbe8"/>
  <rect x="821" y="295" width="28" height="45" rx="6" fill="#ffc857"/>
  <rect x="857" y="295" width="28" height="45" rx="6" fill="#d584d8"/>
  <text x="835" y="366" text-anchor="middle" class="sub">N stages</text>

  <path d="M835 375V428H772" stroke="#ffc857" stroke-width="5" fill="none" marker-end="url(#goldArrow)"/>
  <rect x="585" y="430" width="205" height="112" rx="17" fill="#453515" stroke="#ffc857" stroke-width="3"/>
  <text x="688" y="474" text-anchor="middle" class="label">Consumer</text>
  <text x="688" y="512" text-anchor="middle" class="sub">WGMMA · high regs</text>

  <path d="M585 486H540V352" stroke="#59dbe8" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#cyanArrow)"/>
  <text x="552" y="404" class="sub">release</text>

  <rect x="530" y="585" width="375" height="78" rx="16" fill="#142437" stroke="#435773" stroke-width="2"/>
  <text x="718" y="617" text-anchor="middle" class="label">setmaxnreg</text>
  <text x="718" y="650" text-anchor="middle" class="sub">Producer → Consumer budget</text>
  <text x="905" y="694" text-anchor="end" class="sub">original diagram · 2026</text>
</svg>
