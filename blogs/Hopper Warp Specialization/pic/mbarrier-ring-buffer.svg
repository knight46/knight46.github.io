<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" role="img" aria-labelledby="title desc">
  <title id="title">mbarrier phase protocol for a shared-memory ring buffer</title>
  <desc id="desc">Three shared-memory stages rotate between producer and consumer. Empty protects write ownership, full publishes a completed TMA transfer, and phase flips when a physical slot is reused.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#132139"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="cyanArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#59dbe8"/></marker>
    <marker id="goldArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#ffc857"/></marker>
    <marker id="pinkArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#d584d8"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#edf7ff}
      .head{font-size:39px;font-weight:760}.panelHead{font-size:32px;font-weight:740}
      .sub{font-size:27px;fill:#b8c9da}.label{font-size:28px;font-weight:680}.boxText{font-size:25px;font-weight:650}
      .panel{fill:#0c182a;stroke:#30445e;stroke-width:2}.stage{fill:#101d30;stroke:#536a87;stroke-width:3}
      .empty{fill:#133d50;stroke:#59dbe8;stroke-width:3}.full{fill:#4b3a16;stroke:#ffc857;stroke-width:3}
    </style>
  </defs>
  <rect width="960" height="900" rx="28" fill="url(#bg)"/>
  <text x="480" y="52" text-anchor="middle" class="head">mbarrier Ring Buffer Ownership</text>
  <text x="480" y="90" text-anchor="middle" class="sub">Reuse a slot only after release; flip phase on wraparound</text>

  <rect x="28" y="120" width="904" height="288" rx="24" class="panel" filter="url(#shadow)"/>
  <text x="55" y="165" class="panelHead">Shared-memory slots</text>
  <g transform="translate(55 198)">
    <rect x="0" y="0" width="260" height="165" rx="18" class="stage"/>
    <text x="130" y="40" text-anchor="middle" class="label">Stage 0</text>
    <rect x="22" y="62" width="98" height="58" rx="11" class="empty"/><text x="71" y="99" text-anchor="middle" class="boxText">empty</text>
    <rect x="140" y="62" width="98" height="58" rx="11" class="full"/><text x="189" y="99" text-anchor="middle" class="boxText">full</text>
    <text x="130" y="150" text-anchor="middle" class="sub">phase p</text>
    <rect x="294" y="0" width="260" height="165" rx="18" class="stage"/>
    <text x="424" y="40" text-anchor="middle" class="label">Stage 1</text>
    <rect x="316" y="62" width="98" height="58" rx="11" class="empty"/><text x="365" y="99" text-anchor="middle" class="boxText">empty</text>
    <rect x="434" y="62" width="98" height="58" rx="11" class="full"/><text x="483" y="99" text-anchor="middle" class="boxText">full</text>
    <text x="424" y="150" text-anchor="middle" class="sub">phase p</text>
    <rect x="588" y="0" width="260" height="165" rx="18" class="stage"/>
    <text x="718" y="40" text-anchor="middle" class="label">Stage 2</text>
    <rect x="610" y="62" width="98" height="58" rx="11" class="empty"/><text x="659" y="99" text-anchor="middle" class="boxText">empty</text>
    <rect x="728" y="62" width="98" height="58" rx="11" class="full"/><text x="777" y="99" text-anchor="middle" class="boxText">full</text>
    <text x="718" y="150" text-anchor="middle" class="sub">phase p</text>
  </g>

  <rect x="28" y="440" width="904" height="405" rx="24" class="panel" filter="url(#shadow)"/>
  <text x="55" y="486" class="panelHead">One-stage handshake</text>

  <rect x="55" y="535" width="145" height="56" rx="14" fill="#173f55" stroke="#59dbe8" stroke-width="3"/>
  <text x="128" y="571" text-anchor="middle" class="boxText">Producer</text>
  <rect x="230" y="525" width="170" height="76" rx="14" class="empty"/>
  <text x="315" y="557" text-anchor="middle" class="boxText">wait empty</text>
  <text x="315" y="586" text-anchor="middle" class="sub">(s, p)</text>
  <path d="M400 563H435" stroke="#59dbe8" stroke-width="5" marker-end="url(#cyanArrow)"/>
  <rect x="447" y="525" width="165" height="76" rx="14" fill="#173f55" stroke="#59dbe8" stroke-width="3"/>
  <text x="530" y="557" text-anchor="middle" class="boxText">issue TMA</text>
  <text x="530" y="586" text-anchor="middle" class="sub">async copy</text>
  <path d="M612 563H647" stroke="#59dbe8" stroke-width="5" marker-end="url(#cyanArrow)"/>
  <rect x="659" y="525" width="220" height="76" rx="14" class="full"/>
  <text x="769" y="557" text-anchor="middle" class="boxText">publish full</text>
  <text x="769" y="586" text-anchor="middle" class="sub">TMA done</text>

  <path d="M769 601V658" stroke="#ffc857" stroke-width="5" marker-end="url(#goldArrow)"/>
  <rect x="55" y="684" width="145" height="56" rx="14" fill="#4b3a16" stroke="#ffc857" stroke-width="3"/>
  <text x="128" y="720" text-anchor="middle" class="boxText">Consumer</text>
  <rect x="230" y="674" width="170" height="76" rx="14" class="empty"/>
  <text x="315" y="706" text-anchor="middle" class="boxText">release</text>
  <text x="315" y="735" text-anchor="middle" class="sub">empty (s, p)</text>
  <path d="M447 712H412" stroke="#ffc857" stroke-width="5" marker-end="url(#goldArrow)"/>
  <rect x="447" y="674" width="165" height="76" rx="14" fill="#4b3a16" stroke="#ffc857" stroke-width="3"/>
  <text x="530" y="706" text-anchor="middle" class="boxText">WGMMA</text>
  <text x="530" y="735" text-anchor="middle" class="sub">reads done</text>
  <path d="M659 712H624" stroke="#ffc857" stroke-width="5" marker-end="url(#goldArrow)"/>
  <rect x="659" y="674" width="220" height="76" rx="14" class="full"/>
  <text x="769" y="706" text-anchor="middle" class="boxText">wait full</text>
  <text x="769" y="735" text-anchor="middle" class="sub">(s, p)</text>

  <path d="M315 750V797H878V763" stroke="#d584d8" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#pinkArrow)"/>
  <text x="584" y="829" text-anchor="middle" class="sub">wraparound: phase p → p ⊕ 1</text>

  <circle cx="55" cy="874" r="8" fill="#59dbe8"/><text x="75" y="882" class="sub">writable</text>
  <circle cx="218" cy="874" r="8" fill="#ffc857"/><text x="238" y="882" class="sub">readable</text>
  <circle cx="380" cy="874" r="8" fill="#d584d8"/><text x="400" y="882" class="sub">phase flip</text>
  <text x="905" y="882" text-anchor="end" class="sub">original diagram · 2026</text>
</svg>
