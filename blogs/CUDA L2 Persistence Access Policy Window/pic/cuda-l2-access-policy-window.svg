<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">CUDA L2 persisting access policy window</title>
  <desc id="desc">Three panels show streaming traffic evicting a hot set, access policy window mapping into an L2 set-aside, and shared capacity budgeting across concurrent streams.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1728"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { font: 700 50px "DejaVu Sans", Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 34px "DejaVu Sans", Arial, sans-serif; fill: #94a3b8; }
      .panelTitle { font: 700 40px "DejaVu Sans", Arial, sans-serif; fill: #f8fafc; }
      .label { font: 700 36px "DejaVu Sans", Arial, sans-serif; fill: #f8fafc; }
      .body { font: 400 34px "DejaVu Sans", Arial, sans-serif; fill: #cbd5e1; }
      .small { font: 400 32px "DejaVu Sans", Arial, sans-serif; fill: #cbd5e1; }
      .mono { font: 700 31px "DejaVu Sans Mono", monospace; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1200" height="1800" fill="url(#bg)"/>
  <text x="60" y="70" class="title">CUDA L2 Persisting Access</text>
  <text x="60" y="120" class="subtitle">Capacity budget + address window + replacement priority</text>

  <!-- Panel 1 -->
  <g filter="url(#shadow)">
    <rect x="45" y="160" width="1110" height="470" rx="26" fill="#111f33" stroke="#334155" stroke-width="2"/>
  </g>
  <circle cx="82" cy="206" r="22" fill="#2563eb"/>
  <text x="75" y="217" class="label">1</text>
  <text x="120" y="207" class="panelTitle">Default L2: streaming traffic</text>
  <text x="120" y="251" class="panelTitle">evicts a reusable hot set</text>

  <rect x="80" y="275" width="275" height="118" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
  <text x="110" y="322" class="label">Streaming input</text>
  <text x="110" y="365" class="body">512 MiB, one pass</text>

  <rect x="80" y="452" width="275" height="118" rx="18" fill="#422006" stroke="#fbbf24" stroke-width="3"/>
  <text x="110" y="499" class="label">Hot lookup</text>
  <text x="110" y="542" class="body">16 MiB, reused</text>

  <path d="M 365 334 L 480 334" fill="none" stroke="#60a5fa" stroke-width="8" marker-end="url(#arrowBlue)"/>
  <path d="M 365 511 L 480 511" fill="none" stroke="#fbbf24" stroke-width="8" marker-end="url(#arrowOrange)"/>

  <rect x="500" y="270" width="330" height="305" rx="22" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
  <text x="605" y="315" class="label">Shared L2</text>
  <rect x="535" y="345" width="260" height="45" rx="9" fill="#3b82f6"/>
  <rect x="535" y="402" width="260" height="45" rx="9" fill="#2563eb"/>
  <rect x="535" y="459" width="260" height="45" rx="9" fill="#f59e0b"/>
  <rect x="535" y="516" width="260" height="28" rx="8" fill="#1d4ed8"/>
  <path d="M 795 481 C 850 481, 860 421, 915 421" fill="none" stroke="#fb923c" stroke-width="7" stroke-dasharray="16 12" marker-end="url(#arrowOrange)"/>

  <rect x="925" y="365" width="185" height="112" rx="16" fill="#3f1d1d" stroke="#fb7185" stroke-width="3"/>
  <text x="960" y="413" class="label">Evicted</text>
  <text x="950" y="455" class="small">reload later</text>
  <text x="868" y="587" class="small" fill="#fda4af">Capacity pressure</text>

  <!-- Panel 2 -->
  <g filter="url(#shadow)">
    <rect x="45" y="665" width="1110" height="490" rx="26" fill="#111f33" stroke="#334155" stroke-width="2"/>
  </g>
  <circle cx="82" cy="711" r="22" fill="#059669"/>
  <text x="75" y="722" class="label">2</text>
  <text x="120" y="711" class="panelTitle">Access Policy Window maps a fraction</text>
  <text x="120" y="755" class="panelTitle">into the L2 set-aside</text>

  <rect x="80" y="790" width="440" height="120" rx="18" fill="#172033" stroke="#64748b" stroke-width="3"/>
  <text x="112" y="838" class="label">32 MiB address window</text>
  <rect x="112" y="865" width="170" height="24" rx="6" fill="#10b981"/>
  <rect x="282" y="865" width="170" height="24" rx="6" fill="#3b82f6"/>
  <text x="112" y="945" class="mono">hitRatio = 0.5</text>
  <text x="112" y="990" class="small">50% gets Persisting</text>
  <text x="112" y="1030" class="small">50% gets Streaming</text>

  <path d="M 535 855 C 620 855, 620 835, 700 835" fill="none" stroke="#10b981" stroke-width="8" marker-end="url(#arrowGreen)"/>
  <path d="M 535 885 C 630 910, 630 1025, 700 1025" fill="none" stroke="#60a5fa" stroke-width="7" marker-end="url(#arrowBlue)"/>

  <rect x="720" y="785" width="390" height="295" rx="22" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
  <text x="820" y="830" class="label">Shared L2</text>
  <rect x="755" y="855" width="320" height="112" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="3"/>
  <text x="785" y="902" class="label">16 MiB budget</text>
  <text x="785" y="945" class="small">Persisting priority</text>
  <rect x="755" y="992" width="320" height="56" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="825" y="1030" class="small">Normal L2 capacity</text>

  <rect x="760" y="1090" width="24" height="24" rx="5" fill="#10b981"/>
  <text x="798" y="1112" class="small">Persisting</text>
  <rect x="940" y="1090" width="24" height="24" rx="5" fill="#3b82f6"/>
  <text x="978" y="1112" class="small">Streaming</text>

  <!-- Panel 3 -->
  <g filter="url(#shadow)">
    <rect x="45" y="1190" width="1110" height="480" rx="26" fill="#111f33" stroke="#334155" stroke-width="2"/>
  </g>
  <circle cx="82" cy="1236" r="22" fill="#d97706"/>
  <text x="75" y="1247" class="label">3</text>
  <text x="120" y="1237" class="panelTitle">Concurrent streams share one</text>
  <text x="120" y="1281" class="panelTitle">global capacity budget</text>

  <text x="95" y="1330" class="label" fill="#fda4af">Overcommitted</text>
  <rect x="95" y="1355" width="440" height="85" rx="16" fill="#3f1d1d" stroke="#fb7185" stroke-width="3"/>
  <rect x="125" y="1383" width="245" height="28" rx="7" fill="#fb7185"/>
  <rect x="370" y="1383" width="135" height="28" rx="7" fill="#f97316"/>
  <text x="110" y="1490" class="mono">24×1.0 + 16×1.0</text>
  <text x="110" y="1530" class="mono">= 40 MiB &gt; 20 MiB</text>
  <text x="110" y="1570" class="small">Thrashing risk</text>

  <text x="665" y="1330" class="label" fill="#86efac">Capacity-matched</text>
  <rect x="665" y="1355" width="440" height="85" rx="16" fill="#073b2d" stroke="#34d399" stroke-width="3"/>
  <rect x="695" y="1383" width="147" height="28" rx="7" fill="#34d399"/>
  <rect x="842" y="1383" width="98" height="28" rx="7" fill="#22c55e"/>
  <rect x="940" y="1383" width="135" height="28" rx="7" fill="#1e293b"/>
  <text x="680" y="1490" class="mono">24×0.5 + 16×0.5</text>
  <text x="680" y="1530" class="mono">= 20 MiB budget</text>
  <text x="680" y="1570" class="small">Stable start point</text>

  <rect x="95" y="1595" width="1010" height="55" rx="14" fill="#172033" stroke="#475569" stroke-width="2"/>
  <text x="137" y="1633" class="body">Profile hot sets → allocate ratios → measure L2, DRAM, latency</text>

  <text x="60" y="1730" class="small">Original diagram · NVIDIA CUDA Programming Guide &amp; Runtime API</text>
  <text x="60" y="1772" class="small">Values are illustrative; always profile the target GPU.</text>
</svg>
