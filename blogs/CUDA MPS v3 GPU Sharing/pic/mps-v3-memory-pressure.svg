<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2200" viewBox="0 0 720 1100" role="img" aria-labelledby="title desc">
  <title id="title">MPS v3 device-memory limits and reactive pressure handling</title>
  <desc id="desc">Soft and hard limits define safe, borrowing, and failure zones. Under real contention MPS can terminate an over-soft client so a within-soft requester can retry.</desc>
  <metadata>Original site illustration based on NVIDIA MPS v3 Memory Partitioning documentation. No third-party artwork reused.</metadata>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#94A3B8"/></marker>
    <marker id="arrow-risk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#F87171"/></marker>
  </defs>
  <rect width="720" height="1100" rx="24" fill="#0B1220"/>
  <text x="32" y="48" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Device-memory pressure in MPS v3</text>
  <text x="32" y="80" fill="#CBD5E1" font-family="DejaVu Sans, Arial, sans-serif" font-size="19">Soft means protected share; hard means allocation boundary</text>

  <!-- Left: limit model -->
  <rect x="24" y="108" width="300" height="790" rx="20" fill="#111C2E" stroke="#334155" stroke-width="2"/>
  <text x="48" y="146" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">1  Three memory zones</text>

  <rect x="62" y="186" width="224" height="190" rx="14" fill="#3B151B" stroke="#F87171" stroke-width="2"/>
  <text x="84" y="226" fill="#FCA5A5" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700">FAILURE</text>
  <text x="84" y="260" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19">allocation exceeds hard</text>
  <text x="84" y="292" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19">→ OUT_OF_MEMORY</text>
  <text x="84" y="334" fill="#CBD5E1" font-family="DejaVu Sans, Arial, sans-serif" font-size="17">dmem.max or misc check</text>

  <line x1="48" y1="398" x2="300" y2="398" stroke="#F87171" stroke-width="5"/>
  <text x="62" y="430" fill="#FCA5A5" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700">HARD LIMIT</text>

  <rect x="62" y="452" width="224" height="190" rx="14" fill="#3A2608" stroke="#F59E0B" stroke-width="2"/>
  <text x="84" y="492" fill="#FBBF24" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700">PRESSURE</text>
  <text x="84" y="526" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19">borrowing above soft</text>
  <text x="84" y="558" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19">→ eviction candidate</text>
  <text x="84" y="600" fill="#CBD5E1" font-family="DejaVu Sans, Arial, sans-serif" font-size="17">not an immediate kill</text>

  <line x1="48" y1="664" x2="300" y2="664" stroke="#F59E0B" stroke-width="5"/>
  <text x="62" y="696" fill="#FBBF24" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700">SOFT LIMIT</text>

  <rect x="62" y="718" width="224" height="142" rx="14" fill="#0D332B" stroke="#34D399" stroke-width="2"/>
  <text x="84" y="758" fill="#34D399" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700">SAFE</text>
  <text x="84" y="792" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19">protected headroom</text>
  <text x="84" y="824" fill="#CBD5E1" font-family="DejaVu Sans, Arial, sans-serif" font-size="17">dmem.min reservation</text>

  <!-- Right: pressure handling -->
  <rect x="348" y="108" width="348" height="790" rx="20" fill="#111C2E" stroke="#334155" stroke-width="2"/>
  <text x="372" y="146" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">2  Reactive handling</text>

  <!-- Event-flow connectors stay behind the event nodes but above the panel. -->
  <path d="M510 232 V270" fill="none" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M510 376 V414" fill="none" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M510 520 V558" fill="none" stroke="#F87171" stroke-width="3" marker-end="url(#arrow-risk)"/>
  <path d="M510 664 V702" fill="none" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M510 808 V846" fill="none" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="376" y="170" width="268" height="62" rx="13" fill="#3A2608" stroke="#F59E0B" stroke-width="2"/>
  <text x="510" y="197" text-anchor="middle" fill="#FBBF24" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700">Client A crosses soft</text>
  <text x="510" y="220" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">mark PID as candidate</text>

  <rect x="376" y="270" width="268" height="106" rx="13" fill="#16233A" stroke="#60A5FA" stroke-width="2"/>
  <text x="510" y="302" text-anchor="middle" fill="#60A5FA" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700">Client B requests memory</text>
  <text x="510" y="330" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="17">B is within its soft share</text>
  <text x="510" y="356" text-anchor="middle" fill="#CBD5E1" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">physical allocation hits wall</text>

  <rect x="376" y="414" width="268" height="106" rx="13" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
  <text x="510" y="446" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700">Driver asks MPS</text>
  <text x="510" y="474" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="17">find over-soft victim</text>
  <text x="510" y="500" text-anchor="middle" fill="#CBD5E1" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">requester blocks for reply</text>

  <rect x="376" y="558" width="268" height="106" rx="13" fill="#3B151B" stroke="#F87171" stroke-width="2"/>
  <text x="510" y="590" text-anchor="middle" fill="#FCA5A5" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700">MPS terminates Client A</text>
  <text x="510" y="618" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="17">A is over soft</text>
  <text x="510" y="644" text-anchor="middle" fill="#CBD5E1" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">requester is not the victim</text>

  <rect x="376" y="702" width="268" height="106" rx="13" fill="#0D332B" stroke="#34D399" stroke-width="2"/>
  <text x="510" y="734" text-anchor="middle" fill="#34D399" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700">Client B retries</text>
  <text x="510" y="762" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="17">bounded back-off</text>
  <text x="510" y="788" text-anchor="middle" fill="#CBD5E1" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">success or OUT_OF_MEMORY</text>

  <rect x="376" y="846" width="268" height="36" rx="10" fill="#281A09" stroke="#F59E0B"/>
  <text x="510" y="870" text-anchor="middle" fill="#FBBF24" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">A next sees CLIENT_TERMINATED</text>

  <!-- Operational notes -->
  <rect x="24" y="924" width="672" height="132" rx="18" fill="#111C2E" stroke="#334155" stroke-width="2"/>
  <text x="48" y="962" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700">Deployment conditions</text>
  <text x="48" y="996" fill="#CBD5E1" font-family="DejaVu Sans, Arial, sans-serif" font-size="18">CUDA 13.4+ · Linux cgroup v2 · non-MIG GPU</text>
  <text x="48" y="1028" fill="#CBD5E1" font-family="DejaVu Sans, Arial, sans-serif" font-size="18">Use nvidia-smi or NVML; target the container’s real leaf cgroup.</text>
  <text x="48" y="1080" fill="#94A3B8" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">dmem backend: kernel 6.14+ with DMEM controller · otherwise misc fallback</text>
</svg>
