  <text x="68" y="1025" fill="#FBBF24" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">Boundary note</text>
  <text x="68" y="1054" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="18">Namespaces group policy; they are not MIG-like hardware isolation.</text>
