<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2320" viewBox="0 0 720 1160" role="img" aria-labelledby="title desc">
  <title id="title">CUDA MPS v3 resource hierarchy and submission paths</title>
  <desc id="desc">The control daemon manages named servers. Servers own device boundaries, namespaces group clients, and clients submit GPU work directly rather than through the server.</desc>
  <metadata>Original site illustration based on NVIDIA MPS Architecture, MPS v3 Interface, Namespaces, and Configuration File documentation. No third-party artwork reused.</metadata>
  <defs>
    <marker id="arrow-control" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#94A3B8"/></marker>
    <marker id="arrow-data" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#34D399"/></marker>
  </defs>
