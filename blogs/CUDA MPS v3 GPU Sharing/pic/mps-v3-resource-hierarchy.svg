  <text x="360" y="914" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700">GPU execution engines</text>
  <text x="360" y="946" text-anchor="middle" fill="#CBD5E1" font-family="DejaVu Sans, Arial, sans-serif" font-size="19">work queues · SMs · memory</text>
