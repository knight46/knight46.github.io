<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">传统同 stream 串行执行与 CUDA PDL 双阶段依赖协议</title>
  <desc id="desc">上半部分展示 Primary 完成后 Secondary 才启动；下半部分展示 Primary trigger 后 Secondary 的独立前导工作提前启动，在依赖同步点等待结果可见后再执行依赖主体。</desc>
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .panel { fill: #111c30; stroke: #334766; stroke-width: 2; }
      .title { fill: #f8fafc; font: 700 32px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .panel-title { fill: #f8fafc; font: 700 29px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .label { fill: #dbeafe; font: 600 25px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .small { fill: #c6d3e6; font: 600 24px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .bar-num { fill: #07111f; font: 800 30px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .axis { stroke: #7f91aa; stroke-width: 3; }
      .guide { stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 9 8; }
      .trigger { stroke: #f97316; stroke-width: 5; }
      .visible { stroke: #22c55e; stroke-width: 5; }
      .primary { fill: #60a5fa; }
      .tail { fill: #38bdf8; }
      .preamble { fill: #a78bfa; }
      .wait { fill: #fbbf24; }
      .body { fill: #34d399; }
      .legend-box { fill: #17253d; stroke: #334766; stroke-width: 2; }
      .note { fill: #fbbf24; font: 700 23px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f91aa"/>
    </marker>
  </defs>

  <rect class="bg" width="720" height="900"/>
  <text class="title" x="360" y="43" text-anchor="middle">相邻 Kernel：粗边界与 PDL 细边界</text>

  <rect class="panel" x="24" y="68" width="672" height="255" rx="18"/>
  <text class="panel-title" x="48" y="108">A. 传统同 stream：完整串行</text>
  <text class="label" x="48" y="172">Primary</text>
  <text class="label" x="48" y="239">Secondary</text>
  <line class="axis" x1="170" y1="282" x2="658" y2="282" marker-end="url(#arrow)"/>
  <text class="small" x="606" y="311">时间</text>

  <rect class="primary" x="170" y="137" width="230" height="48" rx="9"/>
  <text class="bar-num" x="285" y="161">1</text>
  <line class="guide" x1="400" y1="125" x2="400" y2="271"/>
  <text class="small" x="400" y="121" text-anchor="middle">结果可见</text>
  <rect class="preamble" x="400" y="204" width="90" height="48" rx="9"/>
  <text class="bar-num" x="445" y="228">2</text>
  <rect class="wait" x="490" y="204" width="45" height="48" rx="9"/>
  <text class="bar-num" x="513" y="228">3</text>
  <rect class="body" x="535" y="204" width="125" height="48" rx="9"/>
  <text class="bar-num" x="598" y="228">4</text>

  <rect class="panel" x="24" y="344" width="672" height="305" rx="18"/>
  <text class="panel-title" x="48" y="385">B. PDL：启动许可 ≠ 数据可见</text>
  <text class="label" x="48" y="455">Primary</text>
  <text class="label" x="48" y="544">Secondary</text>
  <line class="axis" x1="170" y1="608" x2="658" y2="608" marker-end="url(#arrow)"/>
  <text class="small" x="606" y="637">时间</text>

  <rect class="primary" x="170" y="420" width="170" height="48" rx="9"/>
  <text class="bar-num" x="255" y="444">1</text>
  <rect class="tail" x="340" y="420" width="180" height="48" rx="9"/>
  <text class="bar-num" x="430" y="444">5</text>

  <line class="trigger" x1="340" y1="401" x2="340" y2="590"/>
  <text class="small" x="330" y="407" text-anchor="end">Trigger</text>
  <line class="visible" x1="520" y1="401" x2="520" y2="590"/>
  <text class="small" x="531" y="407">结果可见</text>

  <rect class="preamble" x="360" y="509" width="95" height="48" rx="9"/>
  <text class="bar-num" x="408" y="533">2</text>
  <rect class="wait" x="455" y="509" width="65" height="48" rx="9"/>
  <text class="bar-num" x="488" y="533">3</text>
  <rect class="body" x="520" y="509" width="140" height="48" rx="9"/>
  <text class="bar-num" x="590" y="533">4</text>
  <path d="M 343 485 C 365 485, 369 494, 381 506" fill="none" stroke="#f97316" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="small" x="257" y="500">提前启动</text>

  <rect class="legend-box" x="24" y="672" width="672" height="154" rx="18"/>
  <circle class="primary" cx="59" cy="713" r="19"/><text class="bar-num" x="59" y="713">1</text>
  <text class="label" x="91" y="721">Primary 主体</text>
  <circle class="preamble" cx="308" cy="713" r="19"/><text class="bar-num" x="308" y="713">2</text>
  <text class="label" x="340" y="721">独立 preamble</text>
  <circle class="wait" cx="59" cy="779" r="19"/><text class="bar-num" x="59" y="779">3</text>
  <text class="label" x="91" y="787">依赖等待</text>
  <circle class="body" cx="308" cy="779" r="19"/><text class="bar-num" x="308" y="779">4</text>
  <text class="label" x="340" y="787">依赖主体</text>
  <circle class="tail" cx="526" cy="779" r="19"/><text class="bar-num" x="526" y="779">5</text>
  <text class="label" x="558" y="787">尾部</text>

  <text class="note" x="360" y="870">Overlap 只提供机会；完全串行时也必须正确</text>
</svg>
