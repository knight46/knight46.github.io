<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>离线简历加密器</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #07111f;
            color: #edf4ff;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 20% 15%, rgba(43, 116, 255, 0.24), transparent 34rem),
                #07111f;
        }

        main {
            width: min(680px, 100%);
            padding: clamp(24px, 5vw, 42px);
            border: 1px solid rgba(148, 180, 230, 0.28);
            border-radius: 22px;
            background: rgba(13, 29, 50, 0.9);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
        }

        h1 { margin: 0 0 12px; font-size: clamp(1.65rem, 5vw, 2.4rem); }
        p { line-height: 1.65; color: #b9c9df; }
        .safe { color: #8ee3b3; font-weight: 700; }

        label {
            display: grid;
            gap: 8px;
            margin-top: 18px;
            color: #dbe8fa;
            font-weight: 650;
        }

        input, button, a.download {
            width: 100%;
            min-height: 48px;
            border-radius: 12px;
            font: inherit;
        }

        input {
            padding: 11px 13px;
            border: 1px solid #355275;
            color: #fff;
            background: #091727;
        }

        button, a.download {
            margin-top: 22px;
            border: 0;
            display: grid;
            place-items: center;
            padding: 12px 18px;
            color: #fff;
            background: linear-gradient(135deg, #2c72ff, #7657ff);
            font-weight: 750;
            text-decoration: none;
            cursor: pointer;
        }

        button:disabled { opacity: 0.55; cursor: wait; }
        #status { min-height: 1.6em; margin-top: 18px; color: #ffcf75; }
        #downloads[hidden] { display: none; }
        #downloads { margin-top: 22px; padding-top: 4px; border-top: 1px solid #2a415f; }
        #downloads a.download { margin-top: 12px; }
        code { overflow-wrap: anywhere; color: #9bc4ff; }
        small { display: block; margin-top: 18px; line-height: 1.55; color: #8398b5; }
    </style>
</head>
<body>
<main>
    <h1>离线简历加密器</h1>
    <p><span class="safe">PDF与密码不会上传。</span>本页使用浏览器 Web Crypto API，在本机生成与个人网站兼容的 PBKDF2-SHA256＋AES-256-GCM 加密包。</p>

    <form id="encrypt-form">
        <label>
            选择新版PDF
            <input id="pdf-file" type="file" accept="application/pdf,.pdf" required>
        </label>
        <label>
            网站下载密码
            <input id="password" type="password" autocomplete="new-password" required>
        </label>
        <label>
            再输入一次密码
            <input id="password-confirm" type="password" autocomplete="new-password" required>
        </label>
        <button id="encrypt-button" type="submit">在本机生成加密包</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <section id="downloads" hidden>
        <p>生成成功。请分别下载下面两个文件，再上传到Discord：</p>
        <a class="download" id="packet-download">下载 resume-packet.bin</a>
        <a class="download" id="config-download">下载 resume-config.json</a>
        <small>配置文件只包含随机 salt、IV、迭代次数、文件名、大小和SHA-256，不包含密码。</small>
    </section>
</main>

<script>
    const ITERATIONS = 310000;
    const form = document.getElementById("encrypt-form");
    const fileInput = document.getElementById("pdf-file");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("password-confirm");
    const button = document.getElementById("encrypt-button");
    const status = document.getElementById("status");
    const downloads = document.getElementById("downloads");
    const packetDownload = document.getElementById("packet-download");
    const configDownload = document.getElementById("config-download");
    let objectUrls = [];

    function bytesToBase64(bytes) {
        let binary = "";
        for (const byte of bytes) binary += String.fromCharCode(byte);
        return btoa(binary);
    }

    function bytesToHex(bytes) {
        return Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
    }

    function setDownload(anchor, blob, filename) {
        const url = URL.createObjectURL(blob);
        objectUrls.push(url);
        anchor.href = url;
        anchor.download = filename;
    }

    function clearDownloads() {
        objectUrls.forEach((url) => URL.revokeObjectURL(url));
        objectUrls = [];
        downloads.hidden = true;
        packetDownload.removeAttribute("href");
        configDownload.removeAttribute("href");
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearDownloads();

        const file = fileInput.files[0];
        const password = passwordInput.value;
        if (!file || !file.name.toLowerCase().endsWith(".pdf")) {
            status.textContent = "请选择PDF文件。";
            return;
        }
        if (!password || password !== confirmInput.value) {
            status.textContent = "两次输入的密码不一致。";
            return;
        }

        button.disabled = true;
        status.textContent = "正在本机派生密钥并加密，请稍候……";

        try {
            const plaintext = await file.arrayBuffer();
            const header = new TextDecoder("ascii").decode(plaintext.slice(0, 5));
            if (header !== "%PDF-") throw new Error("所选文件不是有效PDF。");

            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const passwordBytes = new TextEncoder().encode(password);
            const baseKey = await crypto.subtle.importKey(
                "raw", passwordBytes, "PBKDF2", false, ["deriveKey"]
            );
            const key = await crypto.subtle.deriveKey(
                { name: "PBKDF2", salt, iterations: ITERATIONS, hash: "SHA-256" },
                baseKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt"]
            );
            const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plaintext);
            const sourceHash = new Uint8Array(await crypto.subtle.digest("SHA-256", plaintext));
            const packetHash = new Uint8Array(await crypto.subtle.digest("SHA-256", encrypted));
            const config = {
                algorithm: "PBKDF2-SHA256/AES-256-GCM",
                salt: bytesToBase64(salt),
                iv: bytesToBase64(iv),
                iterations: ITERATIONS,
                filename: file.name,
                sourceSize: plaintext.byteLength,
                encryptedSize: encrypted.byteLength,
                sourceSha256: bytesToHex(sourceHash),
                encryptedSha256: bytesToHex(packetHash)
            };

            setDownload(packetDownload, new Blob([encrypted], { type: "application/octet-stream" }), "resume-packet.bin");
            setDownload(
                configDownload,
                new Blob([JSON.stringify(config, null, 2) + "\n"], { type: "application/json" }),
                "resume-config.json"
            );
            passwordInput.value = "";
            confirmInput.value = "";
            downloads.hidden = false;
            status.textContent = "加密完成。请下载并回传两个文件。";
        } catch (error) {
            status.textContent = error && error.message ? error.message : "加密失败，请换用最新版Chrome、Edge或Safari。";
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
